<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <radialGradient id="goldCoinGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#4E2600" />
    </radialGradient>
    <linearGradient id="ingotGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="25%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="85%" stop-color="#C47D00" />
      <stop offset="100%" stop-color="#3E2000" />
    </linearGradient>
    <linearGradient id="billGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9" />
      <stop offset="40%" stop-color="#4CAF50" />
      <stop offset="85%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#0A280D" />
    </linearGradient>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Piles of Gold Base Blur -->
  <ellipse cx="250" cy="200" rx="280" ry="60" fill="#FF8F00" opacity="0.35" filter="blur(25px)" />
  <ellipse cx="600" cy="210" rx="350" ry="50" fill="#FFA000" opacity="0.3" filter="blur(25px)" />
  <ellipse cx="950" cy="200" rx="280" ry="60" fill="#FF8F00" opacity="0.35" filter="blur(25px)" />

  <!-- Background Gold Bars on Left -->
  <g filter="url(#glowG)">
    <!-- Bar 1 -->
    <path d="M 40 210 L 70 165 L 170 165 L 140 210 Z" fill="url(#ingotGrad)" />
    <path d="M 70 165 L 170 165 L 195 180 L 95 180 Z" fill="#FFE57F" opacity="0.9" />
    <!-- Bar 2 -->
    <path d="M 120 205 L 150 160 L 250 160 L 220 205 Z" fill="url(#ingotGrad)" />
    <path d="M 150 160 L 250 160 L 275 175 L 175 175 Z" fill="#FFF9C4" opacity="0.95" />
    <!-- Bar 3 on top -->
    <path d="M 85 170 L 115 130 L 210 130 L 180 170 Z" fill="url(#ingotGrad)" />
    <path d="M 115 130 L 210 130 L 235 142 L 140 142 Z" fill="#FFFDE7" />
  </g>

  <!-- Background Cash Bundles -->
  <g filter="url(#glowG)" transform="rotate(-8 320 180)">
    <rect x="290" y="160" width="85" height="42" rx="4" fill="url(#billGrad)" />
    <rect x="290" y="156" width="85" height="42" rx="4" fill="url(#billGrad)" stroke="#A5D6A7" stroke-width="1" />
    <rect x="325" y="156" width="15" height="42" fill="#E8F5E9" opacity="0.9" />
  </g>

  <!-- Gold Bars on Right -->
  <g filter="url(#glowG)">
    <!-- Bar R1 -->
    <path d="M 980 205 L 1010 165 L 1110 165 L 1080 205 Z" fill="url(#ingotGrad)" />
    <path d="M 1010 165 L 1110 165 L 1135 178 L 1035 178 Z" fill="#FFE57F" />
    <!-- Bar R2 -->
    <path d="M 1040 200 L 1070 160 L 1165 160 L 1135 200 Z" fill="url(#ingotGrad)" />
    <path d="M 1070 160 L 1165 160 L 1190 172 L 1095 172 Z" fill="#FFF9C4" />
    <!-- Stacked Top -->
    <path d="M 1015 168 L 1045 130 L 1140 130 L 1110 168 Z" fill="url(#ingotGrad)" />
    <path d="M 1045 130 L 1140 130 L 1165 140 L 1070 140 Z" fill="#FFFDE7" />
  </g>

  <!-- Massive Continuous Coin Spill Foreground -->
  <!-- Layer 1: Back row coins -->
  <g filter="url(#glowG)">
    <ellipse cx="60" cy="220" rx="28" ry="12" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="110" cy="215" rx="30" ry="13" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="170" cy="218" rx="26" ry="12" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="230" cy="212" rx="32" ry="14" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="290" cy="216" rx="29" ry="13" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="360" cy="214" rx="34" ry="15" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="430" cy="218" rx="30" ry="14" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="500" cy="215" rx="35" ry="15" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="580" cy="217" rx="36" ry="16" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="660" cy="213" rx="33" ry="15" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="730" cy="216" rx="32" ry="14" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="800" cy="214" rx="35" ry="15" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="870" cy="218" rx="30" ry="14" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="940" cy="215" rx="32" ry="14" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="1010" cy="216" rx="29" ry="13" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="1080" cy="220" rx="30" ry="13" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="1140" cy="217" rx="26" ry="12" fill="url(#goldCoinGrad)" stroke="#FFE082" stroke-width="1.5" />
  </g>

  <!-- Layer 2: Middle row overlapping coins -->
  <g filter="url(#glowG)">
    <ellipse cx="30" cy="228" rx="27" ry="12" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="85" cy="225" rx="32" ry="14" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="140" cy="227" rx="30" ry="13" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="200" cy="223" rx="34" ry="15" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="260" cy="226" rx="31" ry="14" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="320" cy="224" rx="35" ry="15" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="390" cy="227" rx="33" ry="14" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="460" cy="223" rx="36" ry="16" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="535" cy="226" rx="38" ry="16" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="615" cy="224" rx="36" ry="15" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="690" cy="225" rx="35" ry="15" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="765" cy="223" rx="36" ry="16" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="835" cy="227" rx="32" ry="14" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="905" cy="224" rx="34" ry="15" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="975" cy="226" rx="33" ry="14" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="1045" cy="225" rx="31" ry="14" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="1110" cy="228" rx="28" ry="13" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
    <ellipse cx="1170" cy="226" rx="25" ry="11" fill="url(#goldCoinGrad)" stroke="#FFF9C4" stroke-width="1.5" />
  </g>

  <!-- Sparkles on Coins -->
  <g fill="#FFFDE7">
    <path d="M 140 220 Q 146 220 146 214 Q 146 220 152 220 Q 146 220 146 226 Q 146 220 140 220 Z" />
    <path d="M 330 216 Q 338 216 338 208 Q 338 216 346 216 Q 338 216 338 224 Q 338 216 330 216 Z" />
    <path d="M 540 218 Q 547 218 547 211 Q 547 218 554 218 Q 547 218 547 225 Q 547 218 540 218 Z" />
    <path d="M 770 215 Q 778 215 778 207 Q 778 215 786 215 Q 778 215 778 223 Q 778 215 770 215 Z" />
    <path d="M 980 218 Q 987 218 987 211 Q 987 218 994 218 Q 987 218 987 225 Q 987 218 980 218 Z" />
    <path d="M 1070 155 Q 1076 155 1076 149 Q 1076 155 1082 155 Q 1076 155 1076 161 Q 1076 155 1070 155 Z" />
  </g>
</svg>
