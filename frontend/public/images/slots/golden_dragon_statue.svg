<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <radialGradient id="dragonGold" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="55%" stop-color="#FF9800" />
      <stop offset="85%" stop-color="#B26A00" />
      <stop offset="100%" stop-color="#3E2000" />
    </radialGradient>
    <radialGradient id="rubyEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFCDD2" />
      <stop offset="40%" stop-color="#FF1744" />
      <stop offset="80%" stop-color="#B71C1C" />
      <stop offset="100%" stop-color="#4A0000" />
    </radialGradient>
    <radialGradient id="fireBreath" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFEA00" />
      <stop offset="60%" stop-color="#FF6D00" />
      <stop offset="90%" stop-color="#DD2C00" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="dragonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
      <feGaussianBlur stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Golden Aura -->
  <circle cx="200" cy="240" r="150" fill="#FFB300" opacity="0.25" filter="blur(30px)" />

  <g filter="url(#dragonGlow)">
    <!-- Dragon Wing (Background) -->
    <path d="M 180 180 Q 280 80 370 110 Q 330 160 380 200 Q 310 210 320 270 Q 250 240 180 260 Z" fill="url(#dragonGold)" opacity="0.85" stroke="#FFE082" stroke-width="2" />
    <!-- Wing Ribs -->
    <path d="M 180 180 Q 290 120 370 110 M 230 180 Q 310 180 380 200 M 220 220 Q 280 240 320 270" stroke="#FFF59D" stroke-width="2.5" fill="none" opacity="0.7" />

    <!-- Dragon Coiled Serpent Body -->
    <path d="M 60 440 C 40 360 90 300 130 280 C 180 260 210 200 180 140 C 160 100 200 60 240 70 C 270 80 260 120 230 140 C 190 160 210 240 150 280 C 100 310 90 380 120 440 Z" fill="url(#dragonGold)" stroke="#FFF9C4" stroke-width="2" />

    <!-- Golden Scales Pattern along body -->
    <g fill="none" stroke="#FFE57F" stroke-width="2" opacity="0.6">
      <path d="M 100 350 Q 115 360 130 350 M 90 370 Q 105 380 120 370 M 80 390 Q 95 400 110 390 M 150 240 Q 165 250 180 240 M 170 190 Q 185 200 200 190" />
    </g>

    <!-- Dragon Head & Jaws -->
    <path d="M 220 70 Q 260 40 320 50 Q 300 80 330 95 Q 280 110 250 105 Q 230 125 210 100 Z" fill="url(#dragonGold)" stroke="#FFFDE7" stroke-width="2.5" />
    <!-- Lower Jaw -->
    <path d="M 240 105 Q 290 110 315 102 Q 280 125 235 120 Z" fill="url(#dragonGold)" stroke="#FFE082" stroke-width="1.5" />
    
    <!-- Sharp Golden Fangs -->
    <polygon points="260,95 265,107 270,95" fill="#FFFFFF" />
    <polygon points="280,95 285,110 290,95" fill="#FFFFFF" />
    <polygon points="300,95 304,106 308,95" fill="#FFFFFF" />
    <polygon points="270,118 274,107 278,118" fill="#FFFFFF" />
    <polygon points="290,115 294,105 298,115" fill="#FFFFFF" />

    <!-- Majestic Horns -->
    <path d="M 230 65 Q 200 20 160 15 Q 190 40 220 60 Z" fill="url(#dragonGold)" stroke="#FFF9C4" stroke-width="2" />
    <path d="M 215 70 Q 180 40 140 45 Q 170 65 205 75 Z" fill="url(#dragonGold)" opacity="0.9" />

    <!-- Glowing Ruby Eye -->
    <ellipse cx="265" cy="72" rx="10" ry="7" fill="url(#rubyEye)" stroke="#FFD700" stroke-width="2" filter="drop-shadow(0 0 6px #FF1744)" />
    <ellipse cx="266" cy="72" rx="3" ry="6" fill="#1A0000" />
    <circle cx="263" cy="70" r="2" fill="#FFFFFF" />

    <!-- Dragon Whiskers -->
    <path d="M 300 85 Q 360 90 390 120" stroke="#FFF9C4" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 290 95 Q 350 120 370 160" stroke="#FFD54F" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Dragon Claws gripping gold -->
    <g fill="url(#dragonGold)" stroke="#FFF9C4" stroke-width="1.5">
      <path d="M 120 310 Q 70 290 50 310 Q 80 320 110 325 Z" />
      <path d="M 130 325 Q 70 325 50 345 Q 90 345 125 335 Z" />
      <path d="M 120 335 Q 80 360 65 380 Q 95 365 125 345 Z" />
      <!-- Talons -->
      <polygon points="50,310 35,312 48,318" fill="#FFFFFF" />
      <polygon points="50,345 35,350 48,355" fill="#FFFFFF" />
      <polygon points="65,380 50,390 65,395" fill="#FFFFFF" />
    </g>

    <!-- Fire / Golden Plasma Sparkles from Mouth -->
    <ellipse cx="340" cy="100" rx="35" ry="18" fill="url(#fireBreath)" opacity="0.8" filter="blur(4px)" />
    <circle cx="370" cy="95" r="5" fill="#FFFDE7" filter="drop-shadow(0 0 8px #FFD600)" />
    <circle cx="390" cy="110" r="3" fill="#FFAB00" />
    <circle cx="360" cy="120" r="4" fill="#FF6D00" />
  </g>
</svg>
