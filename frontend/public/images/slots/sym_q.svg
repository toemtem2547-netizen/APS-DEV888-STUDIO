<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="deepBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#161B3D" />
      <stop offset="60%" stop-color="#0B0F24" />
      <stop offset="100%" stop-color="#040612" />
    </radialGradient>

    <linearGradient id="goldChunky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="25%" stop-color="#FFEE58" />
      <stop offset="50%" stop-color="#FFF59D" />
      <stop offset="75%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#3E1A00" />
    </linearGradient>

    <linearGradient id="gemFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#69F0AE" />
      <stop offset="65%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#004D20" />
    </linearGradient>

    <filter id="megaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.95" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cell Background Plate -->
  <rect width="256" height="256" rx="34" fill="url(#deepBg)" />
  <rect width="248" height="248" x="4" y="4" rx="30" fill="none" stroke="url(#goldChunky)" stroke-width="3" stroke-opacity="0.65" />
  
  <!-- Volumetric Center Glow matching gem color -->
  <circle cx="128" cy="128" r="75" fill="#00E676" opacity="0.32" filter="blur(20px)" />

  <!-- Heavy Beveled Casino Lettering -->
  <g filter="url(#megaGlow)" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', 'Trajan Pro', serif" font-weight="900">
    <!-- Extra Deep Cast Shadow Layer -->
    <text x="128" y="202" font-size="176" fill="#000000" stroke="#000000" stroke-width="26" stroke-linejoin="round" opacity="0.85">Q</text>
    
    <!-- Heavy Solid Gold Extrusion -->
    <text x="128" y="196" font-size="176" fill="#3D1800" stroke="#3D1800" stroke-width="22" stroke-linejoin="round">Q</text>
    <text x="128" y="190" font-size="176" fill="url(#goldChunky)" stroke="url(#goldChunky)" stroke-width="16" stroke-linejoin="round">Q</text>
    <text x="128" y="186" font-size="176" fill="#200B00" stroke="#200B00" stroke-width="10" stroke-linejoin="round">Q</text>

    <!-- Glossy Faceted Gem Front Face -->
    <text x="128" y="186" font-size="176" fill="url(#gemFace)">Q</text>
    
    <!-- Prismatic Top Rim Specular Glint -->
    <text x="128" y="181" font-size="176" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="16 26" stroke-linecap="round" opacity="0.85">Q</text>
  </g>

  <!-- Big Sparkling Diamond Flare Accents -->
  <g transform="translate(178, 48)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" opacity="0.4" filter="blur(4px)" />
    <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3" fill="#FFF9C4" />
  </g>

  <g transform="translate(62, 192) scale(0.65)">
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" opacity="0.4" filter="blur(3px)" />
    <path d="M 0 -16 Q 0 0 -16 0 Q 0 0 0 16 Q 0 0 16 0 Q 0 0 0 -16 Z" fill="#FFFFFF" />
  </g>
</svg>
